services:
  - type: web
    name: moan-night-club
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
